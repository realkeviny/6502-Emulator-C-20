name: Windows CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: make installation
      run: winget install ezwinports.make --accept-source-agreements --accept-package-agreements --silent
    - name: python installation 
      uses: actions/setup-python@v5
      with:
          python-version: '3.12'
    - name: conan installation
      run: pip install conan
    - name: conan initialization
      run: conan profile detect --force
    - name: dependency installation
      run: make conan_d
    - name: configure
      run: |
        cmake -H"." -B build -T host=x64 -A x64 -DCMAKE_BUILD_TYPE="Debug"
    - name: building and testing
      run: |
        cmake --build build --parallel --config Debug
        cd build
        ctest .